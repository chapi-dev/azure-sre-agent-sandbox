api_version: azuresre.ai/v1
kind: Hook
spec:
  name: pre-tool-validation
  description: Validates Azure CLI write commands before execution and blocks unsupported or risky patterns.
  type: PreToolUse
  matchTools:
    - RunAzCliWriteCommands
  policy:
    validations:
      - name: block-force-flag
        field: command
        operator: matches
        value: (?i)(^|\s)--force(\s|$)
        action: deny
        message: Remove --force and re-run the command in reviewed mode.
      - name: require-explicit-subscription
        field: command
        operator: notMatches
        value: (?i)(^|\s)--subscription\s+[^\s]+
        action: deny
        message: Every RunAzCliWriteCommands invocation must specify --subscription explicitly.
      - name: block-aks-delete
        field: command
        operator: matches
        value: (?i)\baz\s+aks\s+delete\b
        action: deny
        message: az aks delete is blocked; use a guarded manual change process instead.
      - name: block-resource-group-delete
        field: command
        operator: matches
        value: (?i)\baz\s+group\s+delete\b
        action: deny
        message: az group delete is blocked by policy because it can remove the entire demo environment.