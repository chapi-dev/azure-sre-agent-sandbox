# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 5: Pending Pods - Capacity exhausted
# =============================================================================
# This scenario makes new provisioning-service pods request far more capacity
# than the cluster can provide, leaving them Pending.
#
# SRE Agent can diagnose: Pods pending due to insufficient resources,
# recommend scaling the cluster or reducing resource requests.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/pending-pods.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  namespace: movistar
  labels:
    app: provisioning-service
    scenario: pending-pods
    sre-demo: breakable
spec:
  replicas: 5
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
        scenario: pending-pods
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: provisioning-service
          image: mcr.microsoft.com/mirror/docker/library/nginx:alpine
          resources:
            # BREAKING CHANGE: Requesting more resources than available
            requests:
              memory: "32Gi"    # Excessive memory request
              cpu: "8"         # Excessive CPU request
            limits:
              memory: "64Gi"
              cpu: "16"
