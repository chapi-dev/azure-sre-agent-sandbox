# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 10: Service Selector Mismatch - Silent activation failure
# =============================================================================
# This scenario replaces the activation-service Service with one that has a
# wrong selector label. The activation-service pods are perfectly healthy, but
# the Service routes to nothing because the selector doesn't match any pods.
#
# This is a subtle, realistic networking issue:
# - All pods show Running/Ready (no crashes, no restarts)
# - customer-portal loads fine (it's a client-side app)
# - But placing an activation fails silently (activation-service unreachable)
# - SRE Agent must check Service endpoints, not just pod status
#
# SRE Agent can diagnose: Empty endpoints, selector mismatch between Service
# and Deployment labels, recommend correcting the selector.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/service-mismatch.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: v1
kind: Service
metadata:
  name: activation-service
  namespace: movistar
  labels:
    scenario: service-mismatch
    sre-demo: breakable
spec:
  selector:
    # BREAKING CHANGE: Selector doesn't match any existing pods
    # Real pods have label: app=activation-service
    # This selector looks for app=activation-service-v2 (doesn't exist)
    app: activation-service-v2
  ports:
    - port: 3000
      targetPort: 3000
