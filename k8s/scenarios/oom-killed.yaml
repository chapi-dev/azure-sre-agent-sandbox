# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 1: OOMKilled - Activations failing
# =============================================================================
# This scenario causes activation-service to run out of memory during peak
# provisioning load, simulating failed activations in the Movistar BSS lab.
#
# SRE Agent can diagnose: Pod is OOMKilled, recommend increasing memory limits.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/oom-killed.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activation-service
  namespace: movistar
  labels:
    app: activation-service
    scenario: oom-killed
    sre-demo: breakable
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: activation-service
  template:
    metadata:
      labels:
        app: activation-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: activation-service
          image: ghcr.io/azure-samples/aks-store-demo/order-service:latest
          ports:
            - containerPort: 3000
          # BREAKING CHANGE: Memory limit is way too low
          resources:
            requests:
              memory: "8Mi" # Extremely low
              cpu: "100m"
            limits:
              memory: "16Mi" # This will cause OOMKilled
              cpu: "200m"
          env:
            - name: ORDER_QUEUE_HOSTNAME
              value: "provisioning-queue"
            - name: ORDER_QUEUE_PORT
              value: "5672"
            - name: ORDER_QUEUE_USERNAME
              value: "guest"
            - name: ORDER_QUEUE_PASSWORD
              value: "guest"
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: FASTIFY_ADDRESS
              value: "0.0.0.0"
            # Force memory allocation to trigger OOM faster
            - name: NODE_OPTIONS
              value: "--max-old-space-size=64"
