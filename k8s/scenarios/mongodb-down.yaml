# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 9: Subscriber DB down - Cascading dependency failure
# =============================================================================
# This scenario scales subscriber-db to 0 replicas, simulating a subscriber
# database outage.
# Since provisioning-service depends on subscriber-db for order storage, it will
# start failing health checks and become unavailable. Activations can still be
# placed (they queue in provisioning-queue) but are never completed.
#
# This is the most realistic scenario because it requires SRE Agent to trace
# the dependency chain: provisioning-service → subscriber-db → scaled to 0.
#
# SRE Agent can diagnose: Dependency failures, cascading impact, service
# health correlation, and recommend scaling subscriber-db back up.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/mongodb-down.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber-db
  namespace: movistar
  labels:
    app: subscriber-db
    scenario: subscriber-db-down
    sre-demo: breakable
spec:
  # BREAKING CHANGE: Scale to 0 replicas - database goes offline
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: subscriber-db
  template:
    metadata:
      labels:
        app: subscriber-db
        scenario: subscriber-db-down
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: subscriber-db
          image: mongo:4.4
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: subscriber-db-data
              mountPath: /data/db
      volumes:
        - name: subscriber-db-data
          persistentVolumeClaim:
            claimName: subscriber-db-data-pvc
