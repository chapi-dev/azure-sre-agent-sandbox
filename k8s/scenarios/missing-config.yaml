# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 8: ConfigMap Misconfiguration - CSR console misconfigured
# =============================================================================
# This scenario makes csr-console reference a non-existent ConfigMap,
# preventing the workload from starting.
#
# SRE Agent can diagnose: Pod failing to start due to missing ConfigMap,
# recommend creating the required ConfigMap or fixing the reference.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/missing-config.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csr-console
  namespace: movistar
  labels:
    app: csr-console
    scenario: missing-config
    sre-demo: breakable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: csr-console
  template:
    metadata:
      labels:
        app: csr-console
        scenario: missing-config
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: csr-console
          image: mcr.microsoft.com/mirror/docker/library/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          # BREAKING CHANGE: Reference to non-existent ConfigMap
          envFrom:
            - configMapRef:
                name: unhealthy-csr-config
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config
      volumes:
        # BREAKING CHANGE: Reference to non-existent ConfigMap
        - name: config-volume
          configMap:
            name: unhealthy-csr-config
