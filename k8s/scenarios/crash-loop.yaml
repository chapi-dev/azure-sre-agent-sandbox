# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 2: CrashLoopBackOff - Catalog unavailable
# =============================================================================
# This scenario causes catalog-service to fail on startup, so customers and
# agents can't browse plans or offers in the Movistar BSS lab.
#
# SRE Agent can diagnose: Pod is in CrashLoopBackOff, container exit code,
# recommend checking application logs and configuration.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/crash-loop.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: movistar
  labels:
    app: catalog-service
    scenario: crash-loop
    sre-demo: breakable
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: catalog-service
          image: ghcr.io/azure-samples/aks-store-demo/product-service:latest
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            # BREAKING CHANGE: Invalid AI service URL causes startup failure
            - name: AI_SERVICE_URL
              value: "http://nonexistent-service:9999/"
          # BREAKING CHANGE: Command that causes immediate exit
          command: ["/bin/sh"]
          args: ["-c", "echo 'Starting catalog with invalid config...'; exit 1"]
