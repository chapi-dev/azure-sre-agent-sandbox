# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 7: Network Policy Blocking - Customer activations blocked
# =============================================================================
# This scenario applies a NetworkPolicy that blocks customer-portal traffic to
# activation-service, so customers can't place activations or plan changes.
#
# SRE Agent can diagnose: Network connectivity issues, service unavailable,
# recommend checking network policies and firewall rules.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/network-block.yaml
#
# HOW TO FIX:
# kubectl delete networkpolicy deny-activation-service -n movistar
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-activation-service
  namespace: movistar
  labels:
    scenario: network-block
    sre-demo: breakable
spec:
  podSelector:
    matchLabels:
      app: activation-service
  policyTypes:
    - Ingress
    - Egress
  # BREAKING CHANGE: No ingress or egress rules = all traffic denied
  ingress: []
  egress: []
