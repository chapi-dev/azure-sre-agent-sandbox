# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# SCENARIO 6: Failed Liveness Probe - Health checks failing
# =============================================================================
# This scenario makes provisioning-service fail liveness/readiness checks,
# causing Kubernetes to restart the pods continuously.
#
# SRE Agent can diagnose: Pod being killed due to failed liveness probe,
# recommend checking application health endpoint or probe configuration.
#
# HOW TO BREAK:
# kubectl apply -f k8s/scenarios/probe-failure.yaml
#
# HOW TO FIX:
# kubectl apply -f k8s/base/application.yaml
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  namespace: movistar
  labels:
    app: provisioning-service
    scenario: probe-failure
    sre-demo: breakable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
        scenario: probe-failure
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: provisioning-service
          image: mcr.microsoft.com/mirror/docker/library/nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          # BREAKING CHANGE: Liveness probe to endpoint that doesn't exist
          livenessProbe:
            httpGet:
              path: /health/nonexistent
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/nonexistent
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
