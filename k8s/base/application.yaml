# =============================================================================
# Movistar BSS Application (Telefónica demo, rebranded from AKS-store-demo)
# =============================================================================
# This is the healthy baseline deployment of the Movistar BSS Demo Lab.
# Based on Azure-Samples/aks-store-demo with Telefónica/Movistar service naming.
#
# Architecture:
# - customer-portal: "Mi Movistar" self-service portal
# - csr-console: Customer Service Rep back-office console
# - activation-service: altas, plan changes, top-ups, and porting workflows
# - catalog-service: plan and product catalog
# - provisioning-service: OSS/HLR/HSS provisioning simulator
# - ai-service: Python AI recommendations (optional)
# - traffic-simulator: simulated customer browsing and ordering
# - network-worker: simulated OSS worker completing provisioning
#
# Data Services (in-cluster):
# - provisioning-queue: RabbitMQ-backed provisioning queue
# - subscriber-db: subscriber database
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: movistar
  labels:
    app.kubernetes.io/part-of: movistar-bss
    sre-agent-demo: "true"

---
# =============================================================================
# Provisioning Queue - RabbitMQ
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-queue
  namespace: movistar
  labels:
    app: provisioning-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provisioning-queue
  template:
    metadata:
      labels:
        app: provisioning-queue
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: provisioning-queue
          image: rabbitmq:3.11-management-alpine
          ports:
            - containerPort: 5672
              name: amqp
            - containerPort: 15672
              name: management
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "check_port_connectivity"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"

---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-queue
  namespace: movistar
spec:
  selector:
    app: provisioning-queue
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672

---
# =============================================================================
# Subscriber DB - Database Storage (Azure Managed Disk via CSI driver)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: subscriber-db-data-pvc
  namespace: movistar
  labels:
    app: subscriber-db
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi # Uses Azure Managed Disk CSI driver (default in AKS)
  resources:
    requests:
      storage: 8Gi

---
# =============================================================================
# Subscriber DB - Database
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber-db
  namespace: movistar
  labels:
    app: subscriber-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscriber-db
  template:
    metadata:
      labels:
        app: subscriber-db
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: subscriber-db
          image: mongo:4.4
          ports:
            - containerPort: 27017
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: subscriber-db-data
              mountPath: /data/db
      volumes:
        - name: subscriber-db-data
          persistentVolumeClaim:
            claimName: subscriber-db-data-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: subscriber-db
  namespace: movistar
spec:
  selector:
    app: subscriber-db
  ports:
    - port: 27017
      targetPort: 27017

---
# =============================================================================
# Catalog Service - Rust-based plan catalog API
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: movistar
  labels:
    app: catalog-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: catalog-service
          image: ghcr.io/azure-samples/aks-store-demo/product-service:latest
          ports:
            - containerPort: 3002
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: AI_SERVICE_URL
              value: "http://ai-service:5001/"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: movistar
spec:
  selector:
    app: catalog-service
  ports:
    - port: 3002
      targetPort: 3002

---
# =============================================================================
# Activation Service - Node.js activation workflow API
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activation-service
  namespace: movistar
  labels:
    app: activation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: activation-service
  template:
    metadata:
      labels:
        app: activation-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: activation-service
          image: ghcr.io/azure-samples/aks-store-demo/order-service:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          env:
            - name: ORDER_QUEUE_HOSTNAME
              value: "provisioning-queue"
            - name: ORDER_QUEUE_PORT
              value: "5672"
            - name: ORDER_QUEUE_USERNAME
              value: "guest"
            - name: ORDER_QUEUE_PASSWORD
              value: "guest"
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: FASTIFY_ADDRESS
              value: "0.0.0.0"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: activation-service
  namespace: movistar
spec:
  selector:
    app: activation-service
  ports:
    - port: 3000
      targetPort: 3000

---
# =============================================================================
# Provisioning Service - Go OSS provisioning processor
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provisioning-service
  namespace: movistar
  labels:
    app: provisioning-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: provisioning-service
  template:
    metadata:
      labels:
        app: provisioning-service
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: provisioning-service
          image: ghcr.io/azure-samples/aks-store-demo/makeline-service:latest
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: ORDER_QUEUE_URI
              value: "amqp://guest:guest@provisioning-queue:5672/"
            - name: ORDER_QUEUE_USERNAME
              value: "guest"
            - name: ORDER_QUEUE_PASSWORD
              value: "guest"
            - name: ORDER_QUEUE_NAME
              value: "orders"
            - name: ORDER_DB_URI
              value: "mongodb://subscriber-db:27017"
            - name: ORDER_DB_NAME
              value: "orderdb"
            - name: ORDER_DB_COLLECTION_NAME
              value: "orders"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: provisioning-service
  namespace: movistar
spec:
  selector:
    app: provisioning-service
  ports:
    - port: 3001
      targetPort: 3001

---
# =============================================================================
# Customer Portal - "Mi Movistar" self-service web UI
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
  namespace: movistar
  labels:
    app: customer-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-portal
  template:
    metadata:
      labels:
        app: customer-portal
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: customer-portal
          image: ghcr.io/azure-samples/aks-store-demo/store-front:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: VUE_APP_ORDER_SERVICE_URL
              value: "http://activation-service:3000/"
            - name: VUE_APP_PRODUCT_SERVICE_URL
              value: "http://catalog-service:3002/"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: customer-portal
  namespace: movistar
spec:
  type: LoadBalancer
  selector:
    app: customer-portal
  ports:
    - port: 80
      targetPort: 8080

---
# =============================================================================
# CSR Console - back-office web UI
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csr-console
  namespace: movistar
  labels:
    app: csr-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: csr-console
  template:
    metadata:
      labels:
        app: csr-console
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: csr-console
          image: ghcr.io/azure-samples/aks-store-demo/store-admin:latest
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          env:
            - name: VUE_APP_PRODUCT_SERVICE_URL
              value: "http://catalog-service:3002/"
            - name: VUE_APP_MAKELINE_SERVICE_URL
              value: "http://provisioning-service:3001/"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: csr-console
  namespace: movistar
spec:
  type: LoadBalancer
  selector:
    app: csr-console
  ports:
    - port: 80
      targetPort: 8081

---
# =============================================================================
# Traffic Simulator - load generator for self-service traffic
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-simulator
  namespace: movistar
  labels:
    app: traffic-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-simulator
  template:
    metadata:
      labels:
        app: traffic-simulator
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: traffic-simulator
          image: ghcr.io/azure-samples/aks-store-demo/virtual-customer:latest
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: ORDER_SERVICE_URL
              value: "http://activation-service:3000/"
            - name: ORDERS_PER_HOUR
              value: "100"

---
# =============================================================================
# Network Worker - provisioning simulator (disabled by default due to AMQP compatibility)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: network-worker
  namespace: movistar
  labels:
    app: network-worker
spec:
  replicas: 0 # Disabled: AMQP protocol mismatch with RabbitMQ 3.11
  selector:
    matchLabels:
      app: network-worker
  template:
    metadata:
      labels:
        app: network-worker
    spec:
      nodeSelector:
        nodepool-type: user
      containers:
        - name: network-worker
          image: ghcr.io/azure-samples/aks-store-demo/virtual-worker:latest
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          env:
            - name: MAKELINE_SERVICE_URL
              value: "http://provisioning-service:3001"
            - name: ORDERS_PER_HOUR
              value: "100"
